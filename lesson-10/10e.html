<!DOCTYPE html>
<html>
  <head>
    <style>
      .toggle-button {
        background-color: rgb(230, 230, 230);
        border: none;
        padding: 10px 15px;
        border-radius: 5px;
        margin-right: 10px;
        font-size: 15px;
        cursor: pointer;
      }

      .is-toggled {
        background-color: black;
        color: white;
      }
    </style>
  </head>

  <body>

    <button class="toggle-button js-button" onclick="
      const button = document.querySelector('.js-button');
      button.classList.toggle('is-toggled');
    ">Gaming</button>

    <button class="toggle-button js-button-2" onclick="
      const button = document.querySelector('.js-button-2');
      button.classList.toggle('is-toggled');
    ">Music</button>

    <button class="toggle-button js-button-3" onclick="
      const button = document.querySelector('.js-button-3');
      button.classList.toggle('is-toggled');
    ">Tech</button>

  </body>
</html>
